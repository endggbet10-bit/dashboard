<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Analytics | NOVA Dashboard</title>
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Иконки (Phosphor Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Стили -->
    <link rel="stylesheet" href="css/style.css">
</head>

<!-- По умолчанию ставим темную тему -->
<body class="theme-dark">

    <!-- ========== ЭКРАН ЛОГИНА ========== -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-card">
            <h2 class="auth-card__logo">PULSE<span class="accent">.</span></h2>
            <p class="auth-card__subtitle">Войди в аналитику NOVA</p>

            <form id="authForm" class="auth-form">
                <div class="form-group">
                    <label for="authEmail">Email</label>
                    <input type="email" id="authEmail" placeholder="marketer@nova.com" required>
                </div>
                <div class="form-group">
                    <label for="authPassword">Пароль</label>
                    <input type="password" id="authPassword" placeholder="••••••••" required>
                </div>
                <p class="auth-error" id="authError" hidden></p>
                <button type="submit" class="btn-primary btn-full" id="authSubmit">
                    Войти
                </button>
            </form>

            <p class="auth-hint">
                Нет аккаунта?
                <button type="button" class="link-btn" id="toggleAuthMode">Зарегистрироваться</button>
            </p>
        </div>
    </div>

    <div class="app-layout">
        
        <!-- ================= САЙДБАР (Боковое меню) ================= -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__logo">
                <h2>PULSE<span class="accent">.</span></h2>
                <button class="sidebar__close" id="sidebarClose">
                    <i class="ph ph-x"></i>
                </button>
            </div>

            <nav class="sidebar__nav">
                <a href="#" class="nav-item active">
                    <i class="ph ph-squares-four"></i>
                    <span>Дашборд</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="ph ph-link"></i>
                    <span>Мои ссылки</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="ph ph-users"></i>
                    <span>Аудитория</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="ph ph-gear"></i>
                    <span>Настройки</span>
                </a>
            </nav>

            <div class="sidebar__bottom">
                <button class="nav-item text-danger" id="logoutBtn">
                    <i class="ph ph-sign-out"></i>
                    <span>Выйти</span>
                </button>
            </div>
        </aside>

        <!-- ================= ОСНОВНОЙ КОНТЕНТ ================= -->
        <main class="main-content">
            
            <!-- Шапка (Топбар) -->
            <header class="topbar">
                <div class="topbar__left">
                    <button class="burger-btn" id="sidebarOpen">
                        <i class="ph ph-list"></i>
                    </button>
                    <h1 class="page-title">Обзор аналитики</h1>
                </div>

                <div class="topbar__right">
                    <!-- Переключатель темы -->
                    <button class="theme-toggle" id="themeToggle" title="Сменить тему">
                        <i class="ph ph-sun" id="themeIcon"></i>
                    </button>
                    
                    <div class="user-profile">
                        <div class="avatar">M</div>
                        <span class="user-name" id="userEmail">—</span>
                    </div>
                </div>
            </header>

            <!-- Контент Дашборда -->
            <div class="dashboard-container">
                
                <!-- Карточки статистики -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card__icon"><i class="ph ph-cursor-click"></i></div>
                        <div class="stat-card__info">
                            <p class="stat-label">Всего кликов</p>
                            <h3 class="stat-value" id="statClicks">0</h3>
                            <span class="stat-trend positive"><i class="ph ph-trend-up"></i> Live</span>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card__icon"><i class="ph ph-link-simple"></i></div>
                        <div class="stat-card__info">
                            <p class="stat-label">Активных ссылок</p>
                            <h3 class="stat-value" id="statLinks">0</h3>
                            <span class="stat-trend neutral"><i class="ph ph-minus"></i> —</span>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card__icon"><i class="ph ph-clock"></i></div>
                        <div class="stat-card__info">
                            <p class="stat-label">Средний CTR</p>
                            <h3 class="stat-value" id="statCtr">0</h3>
                            <span class="stat-trend positive"><i class="ph ph-trend-up"></i> клик/ссылка</span>
                        </div>
                    </div>
                </div>

                <!-- Блок с графиком и таблицей -->
                <div class="content-grid">
                    
                    <!-- График -->
                    <div class="panel chart-panel">
                        <div class="panel__header">
                            <h3>Динамика кликов</h3>
                        </div>
                        <div class="panel__body">
                            <!-- Canvas для Chart.js -->
                            <canvas id="clicksChart"></canvas>
                        </div>
                    </div>

                    <!-- Таблица последних ссылок -->
                    <div class="panel table-panel">
                        <div class="panel__header">
                            <h3>Последние ссылки</h3>
                            <button class="btn-primary" id="openCreateModal">
                                <i class="ph ph-plus"></i> Создать
                            </button>
                        </div>
                        <div class="panel__body">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Короткая ссылка</th>
                                        <th>Оригинал</th>
                                        <th>Клики</th>
                                        <th>Действия</th>
                                    </tr>
                                </thead>
                                <tbody id="urlsTableBody">
                                    <!-- сюда JS будет рендерить строки -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>

            </div>
        </main>
    </div>

    <!-- ========== МОДАЛКА: СОЗДАТЬ ССЫЛКУ ========== -->
    <div class="modal-overlay" id="createModal" hidden>
        <div class="modal">
            <div class="modal__header">
                <h3>Создать короткую ссылку</h3>
                <button class="modal__close" id="createModalClose">&times;</button>
            </div>
            <form id="createForm" class="modal__body">
                <div class="form-group">
                    <label for="originalUrl">Длинная ссылка</label>
                    <input type="url" id="originalUrl" placeholder="https://example.com/very/long/path" required>
                </div>
                <p class="auth-error" id="createError" hidden></p>
                <button type="submit" class="btn-primary btn-full" id="createSubmit">
                    Сократить
                </button>
            </form>
        </div>
    </div>

    <!-- Подключение Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Наши скрипты -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
